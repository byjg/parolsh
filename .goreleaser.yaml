version: 2

before:
  hooks:
    - rustup default stable
    - cargo install --locked cargo-zigbuild

builds:
  - id: parolsh
    builder: rust
    binary: parolsh
    # glibc 2.28 and newer: Debian 10+, Ubuntu 20.04+, RHEL/Rocky/Alma 8+.
    targets:
      - x86_64-unknown-linux-gnu.2.28
      - aarch64-unknown-linux-gnu.2.28
    flags:
      - --release
      - --locked

archives:
  - id: parolsh-archive
    name_template: "parolsh_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

nfpms:
  - id: parolsh-pkg
    package_name: parolsh
    ids:
      - parolsh
    vendor: ByJG
    homepage: https://github.com/byjg/parolsh
    maintainer: ByJG <opensource@byjg.com>
    description: Natural-language-first shell for ACP agents
    license: MIT
    dependencies:
      - bash
    contents:
      - src: config.sample.toml
        dst: /usr/share/doc/parolsh/config.sample.toml
      - src: LICENSE
        dst: /usr/share/doc/parolsh/copyright
    formats:
      - deb
      - rpm

checksum:
  name_template: "checksums.txt"

changelog:
  use: github-native

release:
  github:
    owner: byjg
    name: parolsh
