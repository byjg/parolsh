[package]
name = "parolsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Natural-language-first shell for ACP agents"
license = "MIT"
repository = "https://github.com/byjg/parolsh"
homepage = "https://opensource.byjg.com/docs/ai/parolsh"
readme = "README.md"

[dependencies]
agent-client-protocol = "2.2.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.5.2"
nix = { version = "0.31", features = ["process", "signal", "term"] }
reedline = "0.51.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
